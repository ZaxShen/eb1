name: CI

# CI is DISABLED for now — manual-run only (Actions tab → "Run workflow").
# To re-enable automatic runs, uncomment the push / pull_request triggers below.
on:
  workflow_dispatch:
  # push:
  #   branches: ["**"]
  # pull_request:

jobs:
  test:
    name: tests (backend + frontend + e2e + contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python deps
        run: uv sync

      - name: Backend unit (pytest)
        run: uv run pytest tests/ -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: annotation/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: annotation/frontend
        run: npm ci

      - name: Frontend unit + MSW component (vitest)
        working-directory: annotation/frontend
        run: npm run test

      - name: Install Playwright browser
        working-directory: annotation/frontend
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        working-directory: annotation/frontend
        run: npm run test:e2e

      - name: Contract (OpenAPI -> TS, drift check)
        working-directory: annotation/frontend
        run: npm run types:check
