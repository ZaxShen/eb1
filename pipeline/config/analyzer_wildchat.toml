# Domain-neutral analyzer profile — universal eb1 pipeline (WildChat slice).
#
# Pure user/assistant path: the dataset-adapter layer normalizes public
# bot-human corpora into the internal message shape, then the SAME core
# segmenter runs unchanged. No Acme matchmaking accelerators (P1/P3/P4) — on
# plain 2-role data they no-op, so they are turned off here. Open-vocabulary
# taxonomy (v4 invents snake_case slugs when no entry fits).
#
# This profile is opt-in. The production default stays Acme (analyzer.toml,
# prompt_version = "v3").

[analyzer]
model             = "openai/gpt-5.4"
prompt_version        = "v4"        # domain-neutral, 2-role, open-vocabulary
bot_prompt_version    = "bot_v1"
temperature       = 0.0
base_url          = "https://ai-gateway.vercel.sh/v1"  # empty = local Ollama
drop_existing     = false
drop_reviewed     = false
concurrency       = 4
benchmark_mode    = false
window_size       = 200
bot_gap_seconds   = 60
user_window_days  = 3

[routing]
# Accelerators off — pure user/assistant path, no template/cluster routing.
cluster_confidence_threshold = 0.6
template_match_threshold     = 0.75

[pipeline]
user_limit = 0
relabel    = false

[collections]
input_user             = "users"
input_chat             = "sms_chats"
input_chat_message     = "sms_chat_messages"
input_matching         = "matchings"
input_message_template           = "message_templates"
output_chat_segment              = "sms_chat_segments"
output_matching_signal           = "matching_signals"
output_template_classification   = "message_template_classifications"
output_chat_taxonomy             = "sms_chat_taxonomy"
